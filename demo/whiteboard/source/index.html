<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Open Top</title>
<style>
  @font-face {
    font-family: 'Cormorant Garamond';
    src: url('fonts/CormorantGaramond[wght].ttf') format('truetype');
    font-weight: 200 700;
    font-style: normal;
  }
  @font-face {
    font-family: 'Cormorant Garamond';
    src: url('fonts/CormorantGaramond-Italic[wght].ttf') format('truetype');
    font-weight: 200 700;
    font-style: italic;
  }
  html, body {
    margin: 0; overflow: hidden; background: #d8d3ca;
    width: 1920px; height: 1080px;
  }
  canvas { display: block; width: 1920px; height: 1080px; }
  #sub {
    position: absolute; left: 50%; bottom: 54px; z-index: 2;
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px;
    max-width: 86%;
    padding: 10px 22px 12px 16px;
    background: rgba(251, 251, 249, 0.9);
    border-radius: 10px;
    opacity: 0;
    pointer-events: none;
  }
  #sub i {
    display: block; width: 28px; height: 7px; border-radius: 4px;
    background: #d97757; flex: none;
  }
  #sub span {
    font: italic 500 44px 'Cormorant Garamond', serif;
    color: #1f2a44;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="sub"><i></i><span id="subtext"></span></div>
<script type="module" src="film.js"></script>
</body>
</html>
