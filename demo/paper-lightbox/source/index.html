<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>First Bloom</title>
<style>
  @font-face {
    font-family: 'Cormorant Garamond';
    src: url('fonts/CormorantGaramond[wght].ttf') format('truetype');
    font-weight: 200 700;
    font-style: normal;
  }
  @font-face {
    font-family: 'Cormorant Garamond';
    src: url('fonts/CormorantGaramond-Italic[wght].ttf') format('truetype');
    font-weight: 200 700;
    font-style: italic;
  }
  html, body { margin: 0; background: #100e0c; overflow: hidden; width: 1920px; height: 1080px; }
  canvas { display: block; width: 1920px; height: 1080px; }
  #sub {
    position: absolute; left: 50%; bottom: 64px; z-index: 2;
    transform: translateX(-50%);
    font: italic 400 38px 'Cormorant Garamond', Georgia, serif;
    color: #f4efe4;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    text-shadow: 0 2px 10px rgba(0,0,0,.72);
  }
  #sub .band {
    position: absolute; z-index: -1; left: -40px; right: -40px; top: -10px; bottom: -10px;
    background: rgba(8,10,8,.48);
    border-radius: 2px;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="sub"><span class="band"></span><span id="subtext"></span></div>
<script type="module" src="main.js"></script>
</body>
</html>
